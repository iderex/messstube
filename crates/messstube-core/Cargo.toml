[package]
name = "messstube-core"
version = "0.0.0"
description = "Measurement types, the reader interface and the identification registry."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# The corpus tests run without the standard test harness, so that a run can
# report how many cases it could not attempt. The harness can only skip, and a
# skip disappears into a pass. Argued in docs/testing.md, raised in #16.
[[test]]
name = "corpus"
harness = false

# The reader-invariant check runs without the harness for the same reason: it has
# to print how many reader files it examined. That number is zero today, and a
# run that did not say so would read as reader code having been checked and found
# clean. Argued in the target itself, from the last clause of #35.
[[test]]
name = "reader_invariants"
harness = false

[dependencies]

# The lint set is the workspace's, in the root Cargo.toml. A crate that wrote
# its own would be a crate that differs from the others on a decision rather than
# on a preference.
[lints]
workspace = true
