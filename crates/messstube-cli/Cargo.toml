[package]
name = "messstube-cli"
version = "0.0.0"
description = "The operator surface: one command-line tool over the library."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "messstube"
path = "src/main.rs"

[dependencies]
# The library, because the tool is a surface over it and holds no format
# knowledge of its own. The version is written out beside the path because
# deny.toml refuses a wildcard requirement and sets allow-wildcard-paths = false.
messstube-core = { path = "../messstube-core", version = "0.0.0" }

# The lint set is the workspace's, in the root Cargo.toml. A crate that wrote
# its own would be a crate that differs from the others on a decision rather than
# on a preference.
[lints]
workspace = true
