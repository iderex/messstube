[package]
name = "xtask"
version = "0.0.0"
description = "The gate verb: one command that runs the gate's legs in order."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

# The gate verb has no dependencies. It shells out to the toolchain the
# repository already pins, so the gate cannot fail for a reason that has nothing
# to do with the code it is judging.
[dependencies]

# The lint set is the workspace's, in the root Cargo.toml. A crate that wrote
# its own would be a crate that differs from the others on a decision rather than
# on a preference.
[lints]
workspace = true
