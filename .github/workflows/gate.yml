# The first check in this tree that reads the code. Everything else here guards
# the repository; this one compiles it.
#
# ONE VERB, TWO CALLERS. Every step that judges anything below runs `cargo gate`,
# which is the same command a contributor runs before pushing. The verb is in
# `xtask/src/main.rs` and it owns the list of legs, their order, and the rule
# that a run stops at the first failure. This file chooses which legs each check
# covers and nothing else. A step here that ran `cargo clippy` directly would be
# a second gate, and the two would drift apart without anybody deciding that
# they should.
#
# THE JOB NAMES BELOW ARE THE INTERFACE, NOT LABELS. They are what appears on a
# pull request, and they are the first entries of the required-check set that #30
# applies to the branch ruleset. A ruleset entry matches a check by its name, so
# renaming a job here is a change to the gate: the entry stops matching and the
# check silently stops standing between a change and the mainline. Rename one
# only together with the ruleset.
#
# There is more than one job because the failures mean different things. A
# reviewer should be able to see whether a red run is a formatting difference, a
# lint, code that does not build or does not pass its tests, or a dependency the
# policy refuses, without opening a log. How many there are is not written here,
# because the answer is the list below and a count beside it would drift from it.
name: Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

# Deny-all at workflow level. Each job grants only the read it needs.
permissions: {}

# Cancel a superseded run on the same ref. Nothing here publishes anything, so
# a cancelled run costs only the verdict it was going to give about a commit
# nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Referenced by the required-check set in #30 under exactly this name.
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN.
          persist-credentials: false
      - name: Report the toolchain this run used
        # `rust-toolchain.toml` pins the compiler and the components. The rustup
        # shims install what it names on first use, so this workflow needs no
        # toolchain action and adds no third-party dependency to the gate.
        # Printing the versions is what makes a verdict in this log carry the
        # compiler that produced it.
        run: |
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Run the formatting leg of the gate verb
        run: cargo gate format

  lint:
    # Referenced by the required-check set in #30 under exactly this name.
    name: Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the toolchain this run used
        run: |
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Run the lint leg of the gate verb
        run: cargo gate lint

  build-and-test:
    # Referenced by the required-check set in #30 under exactly this name.
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the toolchain this run used
        run: |
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Run the build and test legs of the gate verb
        # Both legs in one call, in the verb's own order, so a compile failure
        # stops the run before the test leg reports the same thing a second
        # time in a less readable form.
        run: cargo gate build test

  minimum-toolchain:
    # Referenced by the required-check set in #30 under exactly this name.
    name: Minimum toolchain build
    runs-on: ubuntu-latest
    # Longer than the format and lint jobs because the step below downloads a
    # second compiler before it can build anything. What it is waiting on is a
    # toolchain install and a compile.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the toolchain this run used
        run: |
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Install the declared minimum toolchain
        # The floor leg runs `rustup run <floor> cargo build`, and `rustup run`
        # refuses a toolchain that is not installed rather than fetching one.
        # That refusal is deliberate: it keeps the dependency leg the only leg
        # of the verb that reaches the network, so an offline contributor gets
        # every verdict the tree alone can give. The consequence is that a
        # caller supplies the toolchain, and this is where the runner does it.
        #
        # The version is not written here. It is read out of the workspace
        # manifest, which is the one place the floor is declared and the field
        # cargo itself refuses an older compiler against. A number in this file
        # would be a third copy, and it would drift from the manifest on the day
        # the floor is raised.
        run: |
          set -euo pipefail
          floor="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "${floor}"
          echo "the declared floor is ${floor}"
          rustup toolchain install --profile minimal "${floor}"
      - name: Run the floor leg of the gate verb
        # It compiles and does not run the suite. A test failure on the floor
        # toolchain is the failure the `Build and test` job above already
        # reports; what this job is about is whether a compiler that old can
        # build the workspace at all. Recorded as a deviation from the reference
        # check in `docs/gate-parity.md`.
        run: cargo gate floor

  dependencies:
    # Referenced by the required-check set in #30 under exactly this name.
    name: Dependency policy and advisories
    runs-on: ubuntu-latest
    # Longer than the other jobs because the step below builds the checker from
    # source. What it is waiting on is a compile, not a scan.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the toolchain this run used
        run: |
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Install the dependency checker
        # Built from crates.io with the pinned toolchain rather than fetched as
        # a prebuilt binary through a third-party action, so the gate's own
        # dependency surface stays the registry and the toolchain the tree
        # already pins. `--locked` builds it from the lockfile its own crate
        # ships. The cost is that this step compiles for minutes on every run,
        # which is why the timeout above is what it is.
        #
        # The version is pinned, so that a new release of the checker cannot
        # turn a green mainline red overnight for reasons unrelated to any
        # change here. It is pinned in ONE file, `.github/cargo-deny-version`,
        # read by this step and by the scheduled caller in advisories.yml. Two
        # callers of one leg disagreeing about the version of the tool that
        # decides it would be two gates again, and the disagreement would show
        # up first on the caller nobody is watching.
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/cargo-deny-version)"
          cargo install --locked "cargo-deny@${version}"
          cargo deny --version
      - name: Run the dependency leg of the gate verb
        # The same leg a contributor runs before pushing. It reads deny.toml,
        # which is where the policy actually lives; this file chooses when the
        # leg runs and nothing about what it decides.
        run: cargo gate deps
